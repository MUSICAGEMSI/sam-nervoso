name: Xracing Auto Comment

on:
  schedule:
    - cron: "* * * * *"

  workflow_dispatch:


jobs:

  monitor:

    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install
      run: |
        pip install -r requirements.txt


    - name: Run bot
      env:
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        python teste_comentario_real.py


    - name: Save state
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

        git add last_video.txt

        git commit -m "update state" || true

        git push
