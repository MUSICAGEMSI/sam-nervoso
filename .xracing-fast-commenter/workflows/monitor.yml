name: Xracing Auto Comment


on:

 schedule:

   - cron: "* * * * *"


 workflow_dispatch:



jobs:


 monitor:


   runs-on: ubuntu-latest


   permissions:

     contents: write



   steps:


   - name:
       Checkout

     uses:
       actions/checkout@v4



   - name:
       Python

     uses:
       actions/setup-python@v5

     with:

       python-version:
         "3.11"



   - name:
       Dependencias

     run:

       pip install -r requirements.txt



   - name:
       Executar bot

     env:

       YOUTUBE_TOKEN:
         ${{ secrets.YOUTUBE_TOKEN }}

       DISCORD_WEBHOOK:
         ${{ secrets.DISCORD_WEBHOOK }}


     run:

       python bot.py



   - name:
       Salvar banco

     run:

       |

       git config user.name github-actions

       git config user.email actions@github.com

       git add database.json

       git commit -m "update database" || true

       git push
